        :root {

        body {

            background: #020617;

            color: white;

            min-height: 100vh;

            overflow-x: hidden;

        }

        .mesh-bg {

            position: fixed;

            inset: 0;

            width: 100%;

            height: 100%;

            background:
                radial-gradient(at 0% 0%, rgba(59,130,246,0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(147,51,234,0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59,130,246,0.1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(147,51,234,0.1) 0px, transparent 50%);

            z-index: -1;

        }

        .glass {

            background: rgba(255,255,255,0.03);

            backdrop-filter: blur(20px) saturate(180%);

            -webkit-backdrop-filter: blur(20px) saturate(180%);

            border: 1px solid rgba(255,255,255,0.08);

            box-shadow: 0 8px 32px rgba(0,0,0,0.4);

            transition: 0.4s ease;

        }

        .glass:hover {

            transform: translateY(-6px);

            border-color: rgba(59,130,246,0.4);

            background: rgba(255,255,255,0.05);

        }

        .filter-btn {

            transition: 0.3s ease;

            background: rgba(255,255,255,0.05);

            border: 1px solid rgba(255,255,255,0.1);

        }

        .filter-btn.active {

            background: #2563eb;

            border-color: #60a5fa;

            box-shadow: 0 0 20px rgba(37,99,235,0.3);

        }

        input,
        select {

            background: rgba(0,0,0,0.25) !important;

            border: 1px solid rgba(255,255,255,0.08) !important;

            color: white !important;

        }

        .video-container::after {

            content: '';

            position: absolute;

            inset: 0;

            box-shadow: inset 0 0 50px rgba(0,0,0,0.45);

            pointer-events: none;

        }

        video {

            width: 100%;

            max-height: 80vh;

            object-fit: contain;

            background: black;

            display: block;

        }

        /* ========================= */
        /* GLASS BACKGROUND SHAPES   */
        /* ========================= */

        .floating-shapes {

            position: fixed;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: -1;

        }

        .glass-shape {

            position: absolute;

            backdrop-filter: blur(18px);

            -webkit-backdrop-filter: blur(18px);

            background: rgba(255,255,255,0.03);

            border: 1px solid rgba(255,255,255,0.08);

            box-shadow: 0 8px 32px rgba(0,0,0,0.2);

        }

        /* Circle */

        .shape1 {

            width: 220px;

            height: 220px;

            border-radius: 50%;

            top: 8%;

            left: 4%;

            animation: float1 20s ease-in-out infinite;

        }

        /* Square */

        .shape2 {

            width: 140px;

            height: 140px;

            border-radius: 30px;

            top: 70%;

            left: 10%;

            transform: rotate(25deg);

            animation: float2 25s ease-in-out infinite;

        }

        /* Diamond */

        .shape3 {

            width: 180px;

            height: 180px;

            top: 20%;

            right: 8%;

            transform: rotate(45deg);

            animation: float3 22s ease-in-out infinite;

        }

        /* Small Circle */

        .shape4 {

            width: 80px;

            height: 80px;

            border-radius: 50%;

            top: 55%;

            right: 15%;

            animation: float4 18s ease-in-out infinite;

        }

        /* Glow Orb */

        .shape5 {

            width: 300px;

            height: 300px;

            border-radius: 50%;

            background: rgba(59,130,246,0.04);

            filter: blur(25px);

            top: 30%;

            left: 35%;

            animation: pulseGlow 16s ease-in-out infinite;

        }

        /* Rectangle */

        .shape6 {

            width: 200px;

            height: 100px;

            border-radius: 24px;

            bottom: 12%;

            right: 30%;

            animation: float5 28s ease-in-out infinite;

        }

        @keyframes float1 {

            0%,100% { transform: translateY(0); }

            50% { transform: translateY(-35px); }

        }

        @keyframes float2 {

            0%,100% { transform: rotate(25deg) translateY(0); }

            50% { transform: rotate(25deg) translateY(-40px); }

        }

        @keyframes float3 {

            0%,100% { transform: rotate(45deg) translateY(0); }

            50% { transform: rotate(45deg) translateY(-25px); }

        }

        @keyframes float4 {

            0%,100% { transform: translateY(0); }

            50% { transform: translateY(20px); }

        }

        @keyframes float5 {

            0%,100% { transform: translateY(0); }

            50% { transform: translateY(-30px); }

        }

        @keyframes pulseGlow {

            0%,100% {

                transform: scale(1);

                opacity: 0.7;

            }

            50% {

                transform: scale(1.15);

                opacity: 1;

            }

        }

    </style>

</head>

<script>

    let lastUploadedUrl = "";

    <script>

        let lastUploadedUrl = "";

        let profilePicUrl = "";

        // TOGGLE UPLOAD PANEL

        function toggleUpload() {

            const panel =
                document.getElementById('uploadPanel');

            panel.classList.toggle('hidden');

            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });

        }

        // FILTER SYSTEM

        function filterItems(cat, event) {

            const cards =
                document.querySelectorAll('.video-card');

            const btns =
                document.querySelectorAll('.filter-btn');

            btns.forEach(btn =>
                btn.classList.remove('active')
            );

            event.target.classList.add('active');

            cards.forEach(card => {

                if (
                    cat === 'all' ||
                    card.classList.contains(cat)
                ) {

                    card.style.display = 'block';

                } else {

                    card.style.display = 'none';

                }

            });

        }

        // VIDEO UPLOAD

        var myWidget =
            cloudinary.createUploadWidget({

                cloudName: 'dybbv2mhe',

                uploadPreset: 'editorconnect',

                sources: ['local', 'camera'],

                multiple: false,

                resourceType: 'video'

            }, (error, result) => {

                if (
                    !error &&
                    result &&
                    result.event === "success"
                ) {

                    lastUploadedUrl =
                        result.info.secure_url;

                    document.getElementById('upload_widget')
                        .innerText = "✅ Video Uploaded";

                    document.getElementById('upload_widget')
                        .classList.add('text-green-500');

                }

            });

        // PROFILE UPLOAD

        var pfpWidget =
            cloudinary.createUploadWidget({

                cloudName: 'dybbv2mhe',

                uploadPreset: 'editorconnect',

                sources: ['local', 'camera'],

                multiple: false,

                resourceType: 'image'

            }, (error, result) => {

                if (
                    !error &&
                    result &&
                    result.event === "success"
                ) {

                    profilePicUrl =
                        result.info.secure_url;

                    document.getElementById('pfp_widget')
                        .innerText = "✅ Profile Uploaded";

                    document.getElementById('pfp_widget')
                        .classList.add('text-green-500');

                }

            });

        // OPEN VIDEO WIDGET

        document
            .getElementById("upload_widget")
            .addEventListener("click", function () {

                myWidget.open();

            }, false);

        // OPEN PROFILE WIDGET

        document
            .getElementById("pfp_widget")
            .addEventListener("click", function () {

                pfpWidget.open();

            }, false);

        // POST WORK

        function publishWork() {

            const title =
                document.getElementById('upTitle').value;

            const name =
                document.getElementById('upName').value;

            const insta =
                document.getElementById('upInsta').value;

            const cat =
                document.getElementById('upCat').value;

            const price = 
                document.getElementById('upPrice').value;

            const deliveryTime = 
                document.getElementById('upDeliveryTime').value;

            if (
                !title ||
                !name ||
                !lastUploadedUrl
            ) {

                alert("Please complete all required fields!");

                return;

            }

            if (!profilePic) {
